<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Lineup</title>
<meta name="theme-color" content="#04060f">
<style>
:root{--text:#f2f2f2;--muted:#9a9aa0;--red:#e03131;--edge:#2e2e31;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0c0c0d}
*{box-sizing:border-box}
body{margin:0;background:#0c0c0d;color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:grid;grid-template-columns:1fr 380px;min-height:100vh}
.left{border-right:3px solid var(--edge);min-width:0}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.left{border-right:0;border-bottom:3px solid var(--edge)}}
.sec{padding:16px;border-bottom:3px solid var(--edge)}
.sec:last-child{border-bottom:0}
.pill{display:block;width:100%;border:3px solid #4a4a4e;border-radius:14px;text-align:center;padding:8px 12px;background:#151516;font:inherit;color:var(--text)}
.title{font-size:1.5rem;font-weight:800}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
@media(max-width:560px){.teams{grid-template-columns:1fr}}
.team .pill{width:80%;margin:0 auto 4px;font-weight:700;font-size:1.1rem;background:var(--tc);color:var(--tt);border-color:var(--tc)}
.capline{text-align:center;color:var(--muted);font-size:.82rem;min-height:1.3em;margin-bottom:10px}
.zone{min-height:64px;border-radius:12px;padding:2px}
.team .zone{border-left:3px solid var(--tc);border-radius:0 12px 12px 0;padding-left:10px}
.zone.over{background:#2a1415;outline:2px dashed var(--red)}
.row{display:flex;border:2px solid var(--pc,#3a3a3d);border-radius:999px;overflow:hidden;margin-bottom:10px;cursor:pointer;user-select:none;background:#161617;color:#f2f2f2}
.row .n{flex:1;padding:6px 14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .p{flex:1;padding:6px 14px;text-align:center;border-left:2px solid var(--pc,#3a3a3d);color:#cfcfd4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.sel{background:color-mix(in srgb,var(--pc,#e03131) 30%,#161617)}
.row[draggable=true]{cursor:grab}
.cap{display:inline-flex;align-items:center;justify-content:center;width:1.4em;height:1.4em;border-radius:50%;background:var(--tc,#e03131);color:var(--tt,#fff);font-style:normal;font-size:.75rem;font-weight:800;margin-right:8px}
.empty{color:var(--muted);font-size:.9rem;padding:8px 4px}
h3{margin:0 0 8px;font-size:1rem}
.hint{font-size:.82rem;color:var(--muted);margin:4px 0 10px}
.bar{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.badge{font-size:.75rem;padding:3px 8px;border-radius:99px;border:1px solid #3a3a3d;color:var(--muted)}
button,input,textarea{font:inherit;color:var(--text)}
input,textarea{border:2px solid #4a4a4e;border-radius:8px;padding:7px 10px;min-width:0;background:#1b1b1d}
button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:#ff7b7b;border:2px solid var(--red)}
button:disabled{opacity:.5;cursor:default}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.add input{flex:1 1 120px}
.right{min-width:0}
.prof{font-family:'Oswald','Arial Narrow','Helvetica Neue',Arial,sans-serif;border-bottom:3px solid var(--edge)}
.prof>.empty{padding:16px;font-family:system-ui,sans-serif}
.pl{background:linear-gradient(160deg,#25282c,#161819);padding:18px 16px 24px;text-align:center;color:#fff}
.pl .nm{font-size:1.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0 0 14px;color:#e8eaed;line-height:1.1;word-break:break-word}
.pl input.nm{width:100%;background:transparent;color:#fff;border:0;border-bottom:2px solid #5b6a78;border-radius:0;text-align:center;padding:4px;font-family:inherit}
.gold{width:14.4em;height:20.6em;font-size:16px;margin:0 auto;clip-path:polygon(10% 0,90% 0,100% 4%,100% 85%,50% 100%,0 85%,0 4%);background:linear-gradient(160deg,#f7e58a,#dcb745 55%,#bd8f22);color:#4a3510;padding:1.9em 1.5em 0;text-align:left}
.g-top{display:flex;justify-content:space-between;align-items:flex-start}
.g-rate{font-size:2.6em;font-weight:700;line-height:1}
.g-pos{font-size:1.1em;font-weight:700;text-transform:uppercase;margin-top:.1em;max-width:3.6em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-photo{width:6.9em;height:6.9em;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;-webkit-mask-image:linear-gradient(#000 75%,transparent);mask-image:linear-gradient(#000 75%,transparent)}
.g-photo img{width:100%;height:100%;object-fit:cover}
.g-photo svg{width:90%;opacity:.4}
.g-name{text-align:center;font-size:1.15em;font-weight:700;text-transform:uppercase;border-bottom:2px solid;border-color:color-mix(in srgb,currentColor 35%,transparent);margin:.3em 0 .5em;padding-bottom:.2em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-stats{display:grid;grid-template-columns:1fr 1fr;gap:.1em .8em;font-size:1.1em}
.g-stats b{font-weight:700;margin-right:.3em}
.ahead{background:#5a616c;color:#fff;font-size:1.3rem;font-weight:700;padding:14px 20px}
.arow{display:grid;grid-template-columns:72px 1fr;column-gap:14px;align-items:center;padding:10px 20px}
.alist .arow:nth-child(odd){background:#e8e9ea}
.alist .arow:nth-child(even){background:#dcdde0}
.alabel{grid-column:1/3;color:#333;font-size:.95rem}
.aval{font-size:1.5rem;font-weight:500;color:#444}
input.aval{width:64px;font-family:inherit;font-size:1.2rem;padding:2px 6px;background:#fff;color:#222;border:2px solid #999}
.abar{height:18px;background:#2b3038}
.abar i{display:block;height:100%;background:#4a9fc9}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-top:3px solid var(--edge);font-family:system-ui,sans-serif}
.acts input{flex:1 1 100%}
.acts input[type=color]{flex:none;width:52px;height:38px;padding:2px;cursor:pointer}
.clr{display:flex;align-items:center;gap:10px;flex:1 1 100%;color:#ddd;font-size:.9rem}
#overlay{position:fixed;inset:0;background:#0c0c0d;z-index:50;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#overlay[hidden]{display:none}
#overlay .prof{max-width:920px;margin:0 auto;border:0}
#overlay .fifa{display:grid;grid-template-columns:1fr 1.3fr}
#overlay .gold{font-size:21px}
#overlay .pl{display:flex;flex-direction:column;justify-content:center}
#overlay .pl .nm{font-size:2.6rem}
@media(max-width:700px){#overlay .fifa{display:block}#overlay .gold{font-size:16px}}

.edge{position:fixed;top:0;bottom:0;width:38vw;max-width:480px;pointer-events:none;z-index:0;background:linear-gradient(90deg,color-mix(in srgb,var(--g,#4b5563) 62%,transparent),transparent 100%);transition:background .4s}
#edgeL{left:0}
#edgeR{right:0;transform:scaleX(-1)}
.wrap{position:relative;z-index:1}
.title{color:#fff;text-shadow:0 0 8px rgba(255,70,90,.9),0 0 22px rgba(255,70,90,.5)}
.pill.title{border-color:var(--red);box-shadow:0 0 10px rgba(224,49,49,.7),inset 0 0 12px rgba(224,49,49,.25)}
.team .pill{box-shadow:0 0 18px var(--tc),inset 0 0 10px rgba(255,255,255,.22)}
.team .zone{box-shadow:-7px 0 12px -7px var(--tc)}
.row{box-shadow:0 0 9px color-mix(in srgb,var(--pc,#3a3a3d) 60%,transparent)}
.av{width:26px;height:26px;flex:none;margin:3px 0 3px 6px;border-radius:50%;border:2px solid var(--pc,#3a3a3d);color:var(--pc,#888);box-shadow:0 0 8px var(--pc,transparent),inset 0 0 6px color-mix(in srgb,var(--pc,#888) 50%,transparent);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:#0c0c0d}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:78%;height:auto}
.gwrap{width:fit-content;margin:0 auto}
button{box-shadow:0 0 12px rgba(224,49,49,.55)}
button.alt{box-shadow:0 0 8px rgba(224,49,49,.35),inset 0 0 6px rgba(224,49,49,.2)}
button:disabled{box-shadow:none}
.badge{box-shadow:0 0 6px rgba(255,255,255,.08)}
input:focus,textarea:focus{outline:0;border-color:var(--red);box-shadow:0 0 8px rgba(224,49,49,.6)}
h3{text-shadow:0 0 8px rgba(255,70,90,.5)}
.ahead{box-shadow:0 0 14px rgba(255,255,255,.08)}
.team .pill{margin-bottom:12px}
.team .capzone{border:2px solid var(--tc);border-radius:16px;padding:8px 10px 2px;margin-bottom:16px;min-height:0;background:color-mix(in srgb,var(--tc) 14%,#0c0c0d);box-shadow:0 0 18px color-mix(in srgb,var(--tc) 55%,transparent),inset 0 0 14px color-mix(in srgb,var(--tc) 22%,transparent)}
.team .capzone.over{background:#2a1415}
.team .capzone.vacant{border-style:dashed;box-shadow:none;background:transparent}
.caplabel{text-align:center;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--tc);font-weight:800;text-shadow:0 0 8px var(--tc);margin-bottom:6px}
.capzone .row{border-width:3px}
.capzone .row .n{padding:9px 14px;font-size:1.1rem}
.capzone .row .p{padding:9px 14px}
.capzone .av{width:36px;height:36px;margin:4px 0 4px 8px}
.capzone .empty{text-align:center;padding:6px 4px 12px}
.ptop{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px 0;font-family:system-ui,sans-serif}
.fifa{display:block;padding:12px 14px 6px}
.pcard{border:3px solid var(--pc);border-radius:10px;background:#101012;padding:12px 14px 14px;max-width:340px;margin:0 auto;box-shadow:0 0 18px color-mix(in srgb,var(--pc) 45%,transparent),inset 0 0 14px color-mix(in srgb,var(--pc) 18%,transparent)}
.pname{display:block;margin:0 0 12px;text-align:center;font-family:inherit;font-weight:700;font-size:2.1rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.1;color:#fff;text-shadow:0 0 10px var(--pc);word-break:break-word;border-bottom:3px solid var(--pc);padding-bottom:6px}
input.pname{width:100%;background:transparent;border-radius:0;border-width:0 0 3px;border-color:var(--pc);padding:2px 0 6px}
.pentw{width:150px;margin:0 auto;filter:drop-shadow(0 0 10px var(--pc))}
.pent{position:relative;width:150px;height:150px;background:var(--pc);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
.pent-in{position:absolute;inset:4px;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);background:#121214;color:var(--pc);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pent-in img{width:100%;height:100%;object-fit:cover}
.pent-in svg{width:72%;height:auto}
.ppos{text-align:center;color:#cfcfd4;font-size:.9rem;letter-spacing:.2em;text-transform:uppercase;margin:6px 0 10px;min-height:1.2em}
.ptotal{border:3px solid var(--pc);border-radius:12px;text-align:center;padding:8px 6px 10px;background:#0c0c0d}
.ptotal .jp{font-size:.8rem;color:#cfcfd4;letter-spacing:.1em}
.ptotal .tt{font-size:1rem;font-weight:700;letter-spacing:.12em}
.ptotal .num{font-size:3.2rem;font-weight:700;line-height:1.05}
.ptotal .rk{font-size:6.5rem;font-weight:700;line-height:1;color:var(--pc);text-shadow:0 0 22px var(--pc)}
.rwrap{margin-top:12px}
.radar{width:100%;height:auto;display:block;max-width:640px;margin:0 auto;font-family:'Oswald','Arial Narrow',Arial,sans-serif}
.edgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1 1 100%}
.edgrid label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted)}
.edgrid input{width:100%;flex:none}
.lbbtn{width:100%;margin-top:14px;padding:12px;font-size:1.05rem;letter-spacing:.04em}
#overlay .fifa{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:24px;align-items:start}
@media(max-width:700px){#overlay .fifa{display:block}}
#lb{position:fixed;inset:0;z-index:60;background:#0c0c0d;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#lb[hidden]{display:none}
.lbwrap{max-width:900px;margin:0 auto;font-family:'Oswald','Arial Narrow',Arial,sans-serif}
.lbtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.lbtop h2{margin:0;font-size:2rem;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 12px rgba(255,70,90,.8)}
.podium{display:flex;align-items:flex-end;gap:8px;min-height:400px}
.pcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;text-align:center}
.av2{width:56px;height:56px;border-radius:50%;border:3px solid var(--pc);color:var(--pc);box-shadow:0 0 12px var(--pc);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:#0c0c0d;margin-bottom:6px}
.av2 img{width:100%;height:100%;object-fit:cover}
.av2 svg{width:78%;height:auto}
.nm2{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.sc{font-size:1.5rem;font-weight:700;color:var(--pc);text-shadow:0 0 10px var(--pc);line-height:1.1;margin-bottom:6px}
.pblock{width:100%;border:2px solid var(--pc);border-bottom:0;border-radius:10px 10px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 45%,#0c0c0d),color-mix(in srgb,var(--pc) 12%,#0c0c0d));box-shadow:0 0 18px color-mix(in srgb,var(--pc) 45%,transparent);display:flex;justify-content:center;padding-top:8px;font-size:2.4rem;font-weight:700;color:#fff}
@media(max-width:560px){.av2{width:38px;height:38px}.sc{font-size:1.1rem}.nm2{font-size:.72rem}.pblock{font-size:1.6rem}}
.wrap.solo{grid-template-columns:minmax(0,920px);justify-content:center}
.wrap.solo .left{border-left:3px solid var(--edge);border-right:3px solid var(--edge)}
.hc{text-align:center;margin:14px 0 0}
.lbwrap{max-width:640px}
.lbtop{gap:12px}
.lbtop h2.lbtitle{flex:1;text-align:center;border:3px solid var(--red);border-radius:6px;padding:8px 10px;font-size:2.2rem;letter-spacing:.06em;background:#101012;box-shadow:0 0 14px rgba(224,49,49,.6),inset 0 0 12px rgba(224,49,49,.2)}
.pod3{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-bottom:22px}
.podcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.podcol.first{flex:1.25}
.pav{border:3px solid var(--pc);color:var(--pc);border-radius:50%;box-shadow:0 0 12px var(--pc);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:#0c0c0d;flex:none;margin-bottom:8px}
.pav img{width:100%;height:100%;object-fit:cover}
.pav svg{width:78%;height:auto}
.podblk{width:100%;border:3px solid var(--pc);border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 38%,#0c0c0d),color-mix(in srgb,var(--pc) 10%,#0c0c0d));box-shadow:0 0 18px color-mix(in srgb,var(--pc) 45%,transparent);padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.podblk .pk{font-size:1.5rem;font-weight:700}
.podblk .pnm{font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podblk .pov{font-size:1.5rem;font-weight:700;color:var(--pc);text-shadow:0 0 10px var(--pc);margin-top:auto}
.lbrow{display:flex;align-items:center;gap:12px;border:3px solid var(--pc);border-radius:999px;padding:4px 22px 4px 5px;margin-bottom:12px;background:#101012;box-shadow:0 0 10px color-mix(in srgb,var(--pc) 50%,transparent);cursor:pointer}
.lbrow .pav{margin-bottom:0}
.lbrow .lr{width:1.6em;color:var(--muted);font-weight:700}
.lbrow .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lbrow .lo{font-size:1.4rem;font-weight:700;color:var(--pc);text-shadow:0 0 8px var(--pc)}
@property --g{syntax:'<color>';inherits:false;initial-value:#4b5563}
body{font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;font-size:17px;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
.edge{transition:--g .5s ease}
.badge,.hint,.ppos,.jp,.edgrid label,.clr,.caplabel{font-family:'Share Tech Mono',ui-monospace,Consolas,monospace}
h3{font-family:'Share Tech Mono',ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.14em;font-size:.85rem}
h3::before{content:"// ";color:var(--red)}
.pill,.row,.zone,.team .zone,.team .capzone,.badge,.pcard,.ptotal,.podblk,.lbrow,.lbtop h2.lbtitle,.cap,button,input,textarea{border-radius:0}
.pill{border-width:2px 10px;text-transform:uppercase;letter-spacing:.14em;font-family:'Oswald','Arial Narrow',sans-serif}
.team .pill{font-size:1.05rem}
.row{border-width:1px 1px 1px 6px;background:linear-gradient(90deg,color-mix(in srgb,var(--pc,#3a3a3d) 16%,#101012),#101012);transition:transform .2s ease,box-shadow .2s ease}
.row:hover{transform:translateX(4px)}
.row .n{font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase}
.row .p{border-left-width:1px;font-family:'Share Tech Mono',ui-monospace,Consolas,monospace;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
.row .hx{margin:3px 0 3px 8px}
button{text-transform:uppercase;letter-spacing:.1em;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.95rem;border:1px solid #ff6b6b;transition:box-shadow .2s ease,background .2s ease,transform .2s ease}
button.alt{border:1px solid var(--red)}
button:hover:not(:disabled){box-shadow:0 0 18px rgba(255,60,60,.85);transform:translateY(-1px)}
button.alt:hover:not(:disabled){background:rgba(224,49,49,.18)}
input,textarea{border:1px solid #3a3a3f;border-left:3px solid var(--red);font-family:'Share Tech Mono',ui-monospace,Consolas,monospace;font-size:.95rem}
.pcard,.ptotal,.podblk,.team .capzone,.lbrow,.lbtop h2.lbtitle{position:relative}
.podblk{overflow:visible}
.pcard::before,.ptotal::before,.podblk::before,.team .capzone::before,.lbrow::before,.lbtop h2.lbtitle::before{content:"";position:absolute;inset:-5px;pointer-events:none;color:var(--pc,var(--tc,#e03131));background:linear-gradient(currentColor,currentColor) 0 0/16px 2px,linear-gradient(currentColor,currentColor) 0 0/2px 16px,linear-gradient(currentColor,currentColor) 100% 0/16px 2px,linear-gradient(currentColor,currentColor) 100% 0/2px 16px,linear-gradient(currentColor,currentColor) 0 100%/16px 2px,linear-gradient(currentColor,currentColor) 0 100%/2px 16px,linear-gradient(currentColor,currentColor) 100% 100%/16px 2px,linear-gradient(currentColor,currentColor) 100% 100%/2px 16px;background-repeat:no-repeat}
.hx{display:inline-block;flex:none;filter:drop-shadow(2px 0 0 var(--pc)) drop-shadow(-2px 0 0 var(--pc)) drop-shadow(0 2px 0 var(--pc)) drop-shadow(0 -2px 0 var(--pc)) drop-shadow(0 0 7px var(--pc))}
.hxi{display:flex;width:100%;height:100%;align-items:flex-end;justify-content:center;overflow:hidden;background:#0c0c0d;color:var(--pc);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hxi img{width:100%;height:100%;object-fit:cover}
.hxi svg{width:70%;height:auto}
.podcol .hx{margin-bottom:12px}
.lbrow{padding:5px 22px 5px 8px}
.lbrow .hx{margin:0}
.left{width:100%;max-width:920px;margin:0 auto;border-left:3px solid var(--edge)}
.wrap{grid-template-columns:1fr 380px;transition:grid-template-columns .5s ease}
.wrap.solo{grid-template-columns:1fr 0px;justify-content:normal}
.right{overflow:hidden;min-width:0}
.right-in{width:380px;transition:opacity .5s ease,transform .5s ease}
.wrap.solo .right-in{opacity:0;transform:translateX(40px)}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
.right-in.swap{animation:fadein .5s ease}
#overlay,#lb{opacity:0;transform:scale(.96);transition:opacity .5s ease,transform .5s ease}

<script>
(function(){
  var S = JSON.parse(document.getElementById('state').textContent);
  var app = document.getElementById('app'), ov = document.getElementById('overlay'), lb = document.getElementById('lb');
  var canEdit=false, dirty=false, sel=null, full=false, board=false, closeT=0, prev={sel:null}, token='', saving=false, again=false, saveT=0, pollJ='', loaded=false, status='';
  var SIL = '<svg viewBox="0 0 100 130" width="80%" fill="none" stroke="currentColor" stroke-width="5"><circle cx="50" cy="40" r="22"/><path d="M8 128c0-34 20-52 42-52s42 18 42 52z"/></svg>';

  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  try{token=localStorage.getItem('lineup_token')||'';canEdit=!!token;}catch(e){}
  function frame2(f){requestAnimationFrame(function(){requestAnimationFrame(f);});}
  function mob(){return !!(window.matchMedia&&window.matchMedia('(max-width:820px)').matches);}
  function layer(n,on,build){
    clearTimeout(n._t);
    if(on){
      var was=!n.hidden;
      n.textContent='';build(n);
      if(!was){n.hidden=false;n.classList.add('fresh');frame2(function(){n.classList.add('on');});clearTimeout(n._f);n._f=setTimeout(function(){n.classList.remove('fresh');},520);}
      else n.classList.add('on');
    }else if(!n.hidden){
      n.classList.remove('on','fresh');
      n._t=setTimeout(function(){n.hidden=true;n.textContent='';},500);
    }
  }
  function hexav(p,size){
    var w=el('span','hx'),i=el('span','hxi');
    w.style.width=size+'px';w.style.height=size+'px';
    if(p.icon){var im=el('img');im.src=p.icon;im.alt='';i.appendChild(im);}else i.innerHTML=SIL;
    w.appendChild(i);return w;
  }
  function closeProfile(){
    full=false;layer(ov,false);
    var w=app.querySelector('.wrap');if(w)w.classList.add('solo');
    clearTimeout(closeT);
    closeT=setTimeout(function(){sel=null;render();},500);
  }
  function rgb(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(function(x){return x+x;}).join('');return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
  function lum(c){var v=rgb(c).map(function(x){x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4);});return .2126*v[0]+.7152*v[1]+.0722*v[2];}
  function shade(c,f){return '#'+rgb(c).map(function(x){var y=Math.round(f>=0?x+(255-x)*f:x*(1+f));return ('0'+y.toString(16)).slice(-2);}).join('');}
  function textOn(c){return lum(c)>.35?'#16120a':'#ffffff';}
  function vivid(c){return lum(c)<.12?shade(c,.45):c;}
  function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
  function byId(id){return S.players.find(function(p){return p.id===id;});}
  function change(){dirty=true;status='';render();if(canEdit&&token){clearTimeout(saveT);saveT=setTimeout(save,1200);}}
  function norm(){
    var seen={};S.players.forEach(function(p){if(!p.attrs)p.attrs={pac:50,sho:50,pas:50,dri:50,def:50,phy:50};if(!p.color)p.color='#d4af37';});
    S.teams.forEach(function(t){t.ids=t.ids.filter(function(id){if(!byId(id)||seen[id])return false;seen[id]=1;return true;});});
    S.teams.forEach(function(t){if(t.cap&&t.ids.indexOf(t.cap)<0)t.cap=null;});
    if(sel&&!byId(sel)){sel=null;full=false;}
  }
  function teamOf(id){return S.teams.findIndex(function(t){return t.ids.indexOf(id)>-1;});}
  function move(id,ti,asCap){
    S.teams.forEach(function(t){if(t.cap===id)t.cap=null;t.ids=t.ids.filter(function(x){return x!==id;});});
    if(ti>=0){S.teams[ti].ids.push(id);if(asCap)S.teams[ti].cap=id;}
    change();
  }

  function row(p,cap){
    var r=el('div','row'+(sel===p.id?' sel':''));
    r.style.setProperty('--pc',vivid(p.color));
    var n=el('span','n');
    if(cap)n.appendChild(el('i','cap','C'));
    n.appendChild(document.createTextNode(p.name));
    r.appendChild(hexav(p,30));r.appendChild(n);
    r.appendChild(el('span','p',p.pos||'—'));
    if(canEdit){r.draggable=true;r.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',p.id);e.dataTransfer.effectAllowed='move';});}
    r.addEventListener('click',function(){sel=p.id;render();});
    return r;
  }
  function zone(ti,ids,emptyText){
    var z=el('div','zone');
    ids.forEach(function(id){var p=byId(id);if(p)z.appendChild(row(p,ti>=0&&S.teams[ti].cap===id));});
    if(!ids.length)z.appendChild(el('div','empty',emptyText));
    if(canEdit){
      z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('over');});
      z.addEventListener('dragleave',function(){z.classList.remove('over');});
      z.addEventListener('drop',function(e){e.preventDefault();z.classList.remove('over');var id=e.dataTransfer.getData('text/plain');if(byId(id))move(id,ti);});
    }
    return z;
  }
  function capSlot(ti){
    var t=S.teams[ti],cp=t.cap&&byId(t.cap);
    var z=el('div','zone capzone'+(cp?'':' vacant'));
    z.appendChild(el('div','caplabel','★ Captain'));
    if(cp)z.appendChild(row(cp,false));
    else z.appendChild(el('div','empty',canEdit?'Drop the captain here.':'No captain yet.'));
    if(canEdit){
      z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('over');});
      z.addEventListener('dragleave',function(){z.classList.remove('over');});
      z.addEventListener('drop',function(e){e.preventDefault();z.classList.remove('over');var id=e.dataTransfer.getData('text/plain');if(byId(id))move(id,ti,true);});
    }
    return z;
  }
  function field(tag,cls,val,set,ph){
    var f=el(tag,cls);f.value=val||'';if(ph)f.placeholder=ph;
    f.addEventListener('change',function(){set(f.value);change();});
    return f;
  }
  function photo(file,cb){
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=320;
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,320,320);
      cb(c.toDataURL('image/jpeg',0.8));};im.src=r.result;};
    r.readAsDataURL(file);
  }

  var ATTRS=[['pac','Speed'],['def','Defense'],['pas','Pass'],['dri','Dribble'],['sho','Shoot'],['phy','Offense']];
  var LBL=[[300,44,125],[500,170,245],[500,412,487],[300,505,585],[100,412,487],[100,170,245]];
  function ovr(p){var s=0;ATTRS.forEach(function(a){s+=(+p.attrs[a[0]]||0);});return Math.round(s/6);}
  function rank(v){v=Math.max(0,Math.min(100,Math.round(+v||0)));return v>=90?'S':'ABCDEFGHI'.charAt(8-Math.floor(v/10));}
  function radar(p){
    var C=300,R=150,ANG=[-90,-30,30,90,150,210],col=vivid(p.color);
    function pt(i,r){var a=ANG[i]*Math.PI/180;return [C+r*Math.cos(a),C+r*Math.sin(a)];}
    function pts(f){return ATTRS.map(function(a,i){var q=pt(i,f(a,i));return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');}
    function val(a){return Math.max(0,Math.min(100,+p.attrs[a[0]]||0));}
    var s='<svg class="radar" viewBox="0 0 600 600" role="img" aria-label="Stat chart">';
    s+='<circle cx="300" cy="300" r="290" fill="none" stroke="#3a3a3f" stroke-width="3"/>';
    s+='<circle cx="300" cy="300" r="266" fill="none" stroke="#2a2a2e" stroke-width="18" stroke-dasharray="3 7"/>';
    s+='<polygon points="'+pts(function(){return R;})+'" fill="#1b1b1e" stroke="#5a5a60" stroke-width="3"/>';
    s+='<polygon points="'+pts(function(){return R/2;})+'" fill="none" stroke="#38383e" stroke-width="2" stroke-dasharray="4 5"/>';
    ATTRS.forEach(function(a,i){var q=pt(i,R);s+='<line x1="300" y1="300" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)+'" stroke="#4a4a50" stroke-width="2" stroke-dasharray="5 5"/>';});
    s+='<polygon points="'+pts(function(a){return R*val(a)/100;})+'" fill="'+col+'" fill-opacity=".5" stroke="'+col+'" stroke-width="4" stroke-linejoin="round" style="filter:drop-shadow(0 0 8px '+col+')"/>';
    ATTRS.forEach(function(a,i){
      var q=pt(i,R),v=val(a),w=pt(i,Math.max(34,R*v/100*0.78)),L=LBL[i];
      s+='<rect x="'+(q[0]-19).toFixed(1)+'" y="'+(q[1]-11).toFixed(1)+'" width="38" height="22" rx="6" fill="#0c0c0d" stroke="#5a5a60" stroke-width="2"/>';
      s+='<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+5).toFixed(1)+'" text-anchor="middle" font-size="14" fill="#9a9aa0">100</text>';
      s+='<text x="'+w[0].toFixed(1)+'" y="'+(w[1]+7).toFixed(1)+'" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" stroke="#0c0c0d" stroke-width="4" paint-order="stroke">'+v+'</text>';
      s+='<text x="'+L[0]+'" y="'+L[1]+'" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="1" fill="#f2f2f2" stroke="#0c0c0d" stroke-width="8" paint-order="stroke">'+a[1].toUpperCase()+'</text>';
      s+='<text x="'+L[0]+'" y="'+L[2]+'" text-anchor="middle" font-size="84" font-weight="700" fill="#0c0c0d" stroke="'+col+'" stroke-width="5" stroke-linejoin="round" paint-order="stroke" style="filter:drop-shadow(0 0 6px '+col+')">'+rank(v)+'</text>';
    });
    return s+'</svg>';
  }
  function avatar(p,cls){
    var a=el('span',cls);
    if(p.icon){var im=el('img');im.src=p.icon;im.alt='';a.appendChild(im);}else a.innerHTML=SIL;
    return a;
  }
  function profile(p){
    var d=el('div','prof');
    if(!p){d.appendChild(el('div','empty','Click a player to see their profile.'));return d;}
    d.style.setProperty('--pc',vivid(p.color));

    var top=el('div','ptop');
    var fs=el('button','alt',full?'Exit full screen':'Full screen');
    fs.addEventListener('click',function(){full=!full;render();});
    var cl=el('button',null,'✕ Close');
    cl.addEventListener('click',closeProfile);
    top.appendChild(fs);top.appendChild(cl);d.appendChild(top);

    var fifa=el('div','fifa'),card=el('div','pcard');
    if(canEdit)card.appendChild(field('input','pname',p.name,function(v){p.name=v.trim()||p.name;}));
    else card.appendChild(el('h2','pname',p.name));
    var pw=el('div','pentw'),pent=el('div','pent'),pin=avatar(p,'pent-in');
    pent.appendChild(pin);pw.appendChild(pent);card.appendChild(pw);
    card.appendChild(el('div','ppos',p.pos||''));
    var tot=el('div','ptotal'),o=ovr(p);
    tot.appendChild(el('div','jp','総合評価'));
    tot.appendChild(el('div','tt','TOTAL'));
    tot.appendChild(el('div','num',String(o)));
    tot.appendChild(el('div','rk',rank(o)));
    card.appendChild(tot);
    var rd=el('div','rwrap');rd.innerHTML=radar(p);
    fifa.appendChild(card);fifa.appendChild(rd);d.appendChild(fifa);

    if(canEdit){
      var a=el('div','acts');
      var eg=el('div','edgrid');
      ATTRS.forEach(function(at){
        var l=el('label',null,at[1]),inp=el('input');inp.type='number';inp.min=0;inp.max=100;inp.value=p.attrs[at[0]];
        inp.addEventListener('change',function(){p.attrs[at[0]]=Math.max(0,Math.min(100,parseInt(inp.value)||0));change();});
        l.appendChild(inp);eg.appendChild(l);
      });
      a.appendChild(eg);
      a.appendChild(field('input','',p.pos,function(v){p.pos=v.trim();},'Position'));
      var cll=el('label','clr','Player colour'),ci=el('input');ci.type='color';ci.value=p.color;
      ci.addEventListener('change',function(){p.color=ci.value;change();});cll.appendChild(ci);a.appendChild(cll);
      var fi=el('input');fi.type='file';fi.accept='image/*';fi.hidden=true;
      fi.addEventListener('change',function(){if(fi.files[0])photo(fi.files[0],function(u){p.icon=u;change();});});
      var pb=el('button','alt','Change photo');pb.addEventListener('click',function(){fi.click();});
      a.appendChild(fi);a.appendChild(pb);
      var ti=teamOf(p.id);
      if(ti>=0){var isC=S.teams[ti].cap===p.id,cb=el('button',null,isC?'★ Remove captain':'★ Make captain');
        cb.addEventListener('click',function(){S.teams[ti].cap=isC?null:p.id;change();});a.appendChild(cb);}
      S.teams.forEach(function(t,i){var b=el('button','alt','→ '+t.name);b.addEventListener('click',function(){move(p.id,i);});a.appendChild(b);});
      var np=el('button','alt','→ Not playing');np.addEventListener('click',function(){move(p.id,-1);});a.appendChild(np);
      var del=el('button',null,'Delete player');
      del.addEventListener('click',function(){if(confirm('Delete '+p.name+'?')){S.players=S.players.filter(function(q){return q.id!==p.id;});sel=null;full=false;change();}});
      a.appendChild(del);
      d.appendChild(a);
    }
    return d;
  }

  function podium(){
    var list=S.players.slice().sort(function(a,b){return ovr(b)-ovr(a)||a.name.localeCompare(b.name);});
    var wrap=el('div','lbwrap'),top=el('div','lbtop');
    top.appendChild(el('h2','lbtitle','Leader Board'));
    var x=el('button',null,'✕ Close');x.addEventListener('click',function(){board=false;render();});
    top.appendChild(x);wrap.appendChild(top);
    if(!list.length){wrap.appendChild(el('div','empty','No players yet.'));return wrap;}
    var open=function(p){return function(){sel=p.id;board=false;render();};};
    var pod=el('div','pod3'),PL=['1st','2nd','3rd'],H=[230,170,135],SZ=[84,70,64];
    [1,0,2].forEach(function(ix){
      var p=list[ix];if(!p)return;
      var c=el('div','podcol'+(ix===0?' first':''));c.style.setProperty('--pc',vivid(p.color));
      c.appendChild(hexav(p,SZ[ix]));
      var b=el('div','podblk');b.style.height=H[ix]+'px';
      b.appendChild(el('div','pk',PL[ix]));
      b.appendChild(el('div','pnm',p.name));
      b.appendChild(el('div','pov',ovr(p)+' · '+rank(ovr(p))));
      c.appendChild(b);c.addEventListener('click',open(p));pod.appendChild(c);
    });
    wrap.appendChild(pod);
    var rest=el('div','lblist');
    list.slice(3).forEach(function(p,i){
      var r=el('div','lbrow');r.style.setProperty('--pc',vivid(p.color));
      r.appendChild(hexav(p,44));
      r.appendChild(el('span','lr',String(i+4)));
      r.appendChild(el('span','ln',p.name));
      r.appendChild(el('span','lo',ovr(p)+' · '+rank(ovr(p))));
      r.addEventListener('click',open(p));rest.appendChild(r);
    });
    wrap.appendChild(rest);
    return wrap;
  }
  function lbBtn(){var b=el('button','lbbtn','🏆 Leaderboard');b.addEventListener('click',function(){board=true;render();});return b;}

  function render(){clearTimeout(closeT);
    norm();
    app.textContent='';
    var wrap=el('div','wrap'),left=el('div','left'),right=el('div','right');

    if(canEdit){
      var top=el('div','sec bar');
      top.appendChild(el('span','badge',status||(dirty?'Unsaved changes':'Editing as owner')));
      var pub=el('button',null,'Save now');pub.disabled=!dirty;pub.addEventListener('click',function(){clearTimeout(saveT);save();});
      top.appendChild(pub);left.appendChild(top);
    }

    var s1=el('div','sec');
    if(canEdit)s1.appendChild(field('input','pill title',S.title,function(v){S.title=v;}));
    else s1.appendChild(el('div','pill title',S.title));
    var teams=el('div','teams'),tcs=[];
    S.teams.forEach(function(t,i){
      var cp=t.cap&&byId(t.cap),tc=cp?vivid(cp.color):'#4b5563';
      var c=el('div','team');
      c.style.setProperty('--tc',tc);c.style.setProperty('--tt',textOn(tc));tcs[i]=tc;
      if(canEdit)c.appendChild(field('input','pill',t.name,function(v){t.name=v||t.name;}));
      else c.appendChild(el('div','pill',t.name));
      c.appendChild(capSlot(i));
      c.appendChild(zone(i,t.ids.filter(function(x){return x!==t.cap;}),canEdit?'Drop players here.':'No players yet.'));
      teams.appendChild(c);
    });
    s1.appendChild(teams);if(!sel)s1.appendChild(el('p','hint hc','Click a player to see their profile.'));left.appendChild(s1);
    document.getElementById('edgeL').style.setProperty('--g',tcs[0]||'#4b5563');
    document.getElementById('edgeR').style.setProperty('--g',tcs[1]||'#4b5563');

    if(canEdit){
      var s2=el('div','sec');
      s2.appendChild(el('h3',null,'Menu (only you see this)'));
      var add=el('div','add'),ni=el('input'),pi=el('input'),ab=el('button',null,'Add player');
      ni.placeholder='Player name';pi.placeholder='Position';
      var go=function(){var n=ni.value.trim();if(!n)return;var p={id:uid(),name:n,pos:pi.value.trim(),stats:'',icon:''};S.players.push(p);sel=p.id;change();};
      ab.addEventListener('click',go);
      [ni,pi].forEach(function(i){i.addEventListener('keydown',function(e){if(e.key==='Enter')go();});});
      add.appendChild(ni);add.appendChild(pi);add.appendChild(ab);s2.appendChild(add);
      s2.appendChild(el('h3',null,'Not playing'));
      s2.appendChild(el('p','hint','Drag players into Team A or Team B. Drop a player in the Captain slot above a team to make them captain. Drag them back here to take them out. On a phone, tap a player and use the buttons in the profile.'));
      var notIds=S.players.filter(function(p){return teamOf(p.id)<0;}).map(function(p){return p.id;});
      s2.appendChild(zone(-1,notIds,'Everyone is on a team.'));
      s2.appendChild(lbBtn());left.appendChild(s2);
    }

    if(!canEdit){var s3=el('div','sec');s3.appendChild(lbBtn());left.appendChild(s3);}
    left.appendChild(loginBtn());
    var ri=el('div','right-in');ri.appendChild(profile(sel?byId(sel):null));right.appendChild(ri);
    wrap.appendChild(left);wrap.appendChild(right);
    var opening=sel&&!prev.sel;
    if(!sel)wrap.classList.add('solo');
    else if(opening){wrap.classList.add('solo');frame2(function(){wrap.classList.remove('solo');});}
    if(sel&&((prev.sel&&prev.sel!==sel)||(opening&&mob())))ri.classList.add('swap');
    app.appendChild(wrap);

    layer(ov,!!(full&&sel),function(n){n.appendChild(profile(byId(sel)));});
    layer(lb,board,function(n){n.appendChild(podium());});
    prev.sel=sel;
  }

  function ghInfo(){
    var m=location.hostname.match(/^([^.]+)\.github\.io$/);if(!m)return null;
    var seg=location.pathname.split('/').filter(Boolean)[0];
    if(!seg||/\.html?$/.test(seg))seg=m[1]+'.github.io';
    return {owner:m[1],repo:seg};
  }
  async function save(){
    if(!token)return;
    if(saving){again=true;return;}
    var info=ghInfo();
    if(!info){status='Saving only works on your GitHub Pages link';render();return;}
    saving=true;status='Saving…';
    var ok=false;
    try{
      var api='https://api.github.com/repos/'+info.owner+'/'+info.repo+'/contents/data.json';
      var hd={Authorization:'Bearer '+token,Accept:'application/vnd.github+json'};
      var cur=await fetch(api,{headers:hd});
      var sha=cur.ok?(await cur.json()).sha:undefined;
      var body={message:'Update lineup',content:btoa(unescape(encodeURIComponent(JSON.stringify(S))))};
      if(sha)body.sha=sha;
      var r=await fetch(api,{method:'PUT',headers:hd,body:JSON.stringify(body)});
      if(!r.ok)throw new Error(r.status);
      ok=true;
    }catch(e){status=(e.message==='401'||e.message==='403'||e.message==='404')?'Save failed: check your token':'Save failed: try again';}
    saving=false;
    if(ok){status='Saved ✓ Friends see it in about a minute.';if(!again)dirty=false;}
    if(again){again=false;save();return;}
    render();
  }
  function loginBtn(){
    var f=el('div','sec');f.style.textAlign='center';
    var b=el('button','alt ghostbtn',canEdit?'Log out':'Owner login');
    b.addEventListener('click',function(){
      if(canEdit){token='';try{localStorage.removeItem('lineup_token');}catch(e){}canEdit=false;dirty=false;render();return;}
      var t=prompt('Paste your GitHub token to edit (it stays in this browser only):');
      if(t&&t.trim()){token=t.trim();try{localStorage.setItem('lineup_token',token);}catch(e){}canEdit=true;render();}
    });
    f.appendChild(b);return f;
  }
  async function load(){
    try{
      var r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
      if(r.ok){
        var txt=await r.text();
        if(txt!==pollJ){
          pollJ=txt;
          var d=JSON.parse(txt);
          if(d&&d.teams&&d.players&&(!loaded||(!canEdit&&!dirty))){S=d;render();}
        }
      }
    }catch(e){}
    loaded=true;
  }

  render();
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(board||full)){board=false;full=false;render();}});
  load();setInterval(load,45000);
})();
</script>


</body></html>
